name: Giai nen ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
concurrency:
  group: unzip
  cancel-in-progress: false
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen
        run: |
          set -e
          zip=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$zip" ]; then echo "Khong co file zip"; exit 0; fi

          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$zip" -d /tmp/x

          # Bo .git trong zip (tranh ghi de .git cua repo)
          find /tmp/x -name .git -prune -exec rm -rf {} +

          # Bo .github/workflows (GITHUB_TOKEN khong duoc push file workflow)
          find /tmp/x -type d -path '*/.github/workflows' -prune -exec rm -rf {} +

          # Neu zip chi co 1 thu muc goc thi lay ben trong thu muc do
          if [ "$(ls /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            src="/tmp/x/$(ls /tmp/x)"
          else
            src="/tmp/x"
          fi

          chmod -R u+rwX "$src"
          cp -a "$src/." .
          rm -f "$zip"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Giai nen ZIP" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push that bai, thu lai lan $i"
            sleep 3
          done
          exit 1
