name: Giai nen ZIP
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen
        run: |
          set -e
          zip=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$zip" ]; then echo "Khong co file zip"; exit 0; fi
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$zip" -d /tmp/x
          # Bo moi thu muc .git nam trong zip (tranh ghi de .git cua repo -> Permission denied)
          find /tmp/x -name .git -prune -exec rm -rf {} +
          if [ "$(ls /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            src="/tmp/x/$(ls /tmp/x)"
          else
            src="/tmp/x"
          fi
          chmod -R u+rwX "$src"
          cp -a "$src/." .
          rm -f "$zip"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Giai nen ZIP" || exit 0
          git push
